<!DOCTYPE html>
<html>
<head>
    <meta name="referrer" content="no-referrer-when-downgrade">
  <title>Movies</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="movies.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background: rgba(10,10,15,0.85) !important; backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.06);">
      <div class="container-fluid px-4">
          <a class="navbar-brand fw-bold" href="index.html">Event<span style="color:#e50914">Nest</span></a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
              <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menu">
              <ul class="navbar-nav ms-auto">
                  <li class="nav-item"><a href="index.html" class="nav-link" style="color: rgba(255,255,255,0.75);">Home</a></li>
                  <li class="nav-item"><a href="movies.html" class="nav-link active" style="color:#e50914;">Movies</a></li>
                  <li class="nav-item"><a href="concerts.html" class="nav-link" style="color: rgba(255,255,255,0.75);">Concerts</a></li>
                  <li class="nav-item"><a href="cricket.html" class="nav-link" style="color: rgba(255,255,255,0.75);">Cricket</a></li>
              </ul>
          </div>
      </div>
  </nav>

  <!-- Hero Section -->
  <div class="hero movie-hero" style="background-image: url('images/cinema_hero.jpg') !important; background-size: cover !important; background-position: center center !important; min-height: 45vh; padding: 120px 0 60px 0;">
    <div class="container text-center text-md-start">
        <h1>Blockbuster Movies</h1>
        <p class="lead">Book tickets for the biggest movies of the year. Experience cinema like never before.</p>
    </div>
  </div>

  <!-- Movie Center Filters Scoreboard Panel -->
  <div class="container mt-4">
      <div class="p-4 rounded-4 shadow scoreboard-filters" style="background: #11111b; border: 1px solid rgba(229, 9, 20, 0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
          <h5 class="text-white fw-bold mb-3 d-flex align-items-center"><i class="bi bi-sliders text-danger me-2"></i> CINEMA CENTER FILTERS</h5>
          <div class="row g-3">
              <div class="col-md-3 col-sm-6">
                  <label class="form-label text-secondary small fw-bold">Search Movie</label>
                  <input class="form-control" type="search" placeholder="Search title or genre..." id="search" style="background: rgba(255,255,255,0.05); color:#fff; border: 1px solid #333; border-radius: 10px;">
              </div>
              <div class="col-md-3 col-sm-6">
                  <label class="form-label text-secondary small fw-bold">Language</label>
                  <select class="form-select" id="langFilter" style="background: rgba(255,255,255,0.05); color:#fff; border: 1px solid #333; border-radius: 10px; padding: 7px 14px;">
                      <option value="" style="background:#111;">All Languages</option>
                      <option value="English" style="background:#111;">English</option>
                      <option value="Hindi" style="background:#111;">Hindi</option>
                      <option value="Telugu" style="background:#111;">Telugu</option>
                      <option value="Tamil" style="background:#111;">Tamil</option>
                  </select>
              </div>
              <div class="col-md-3 col-sm-6">
                  <label class="form-label text-secondary small fw-bold">Genre</label>
                  <select class="form-select" id="genreFilter" style="background: rgba(255,255,255,0.05); color:#fff; border: 1px solid #333; border-radius: 10px; padding: 7px 14px;">
                      <option value="" style="background:#111;">All Genres</option>
                      <option value="Action" style="background:#111;">Action</option>
                      <option value="Comedy" style="background:#111;">Comedy</option>
                      <option value="Drama" style="background:#111;">Drama</option>
                      <option value="Sci-Fi" style="background:#111;">Sci-Fi</option>
                      <option value="Animation" style="background:#111;">Animation</option>
                      <option value="Thriller" style="background:#111;">Thriller</option>
                  </select>
              </div>
              <div class="col-md-3 col-sm-6">
                  <label class="form-label text-secondary small fw-bold">Format</label>
                  <select class="form-select" id="formatFilter" style="background: rgba(255,255,255,0.05); color:#fff; border: 1px solid #333; border-radius: 10px; padding: 7px 14px;">
                      <option value="" style="background:#111;">All Formats</option>
                      <option value="2D" style="background:#111;">2D</option>
                      <option value="3D" style="background:#111;">3D</option>
                      <option value="IMAX" style="background:#111;">IMAX</option>
                      <option value="4DX" style="background:#111;">4DX</option>
                  </select>
              </div>
              <div class="col-md-3 col-sm-6">
                  <label class="form-label text-secondary small fw-bold">Rating</label>
                  <select class="form-select" id="ratingFilter" style="background: rgba(255,255,255,0.05); color:#fff; border: 1px solid #333; border-radius: 10px; padding: 7px 14px;">
                      <option value="" style="background:#111;">All Ratings</option>
                      <option value="8" style="background:#111;">⭐ 8+ Rating</option>
                      <option value="7" style="background:#111;">⭐ 7+ Rating</option>
                      <option value="6" style="background:#111;">⭐ 6+ Rating</option>
                  </select>
              </div>
              <div class="col-md-3 col-sm-6">
                  <label class="form-label text-secondary small fw-bold">City</label>
                  <select class="form-select" id="cityFilter" style="background: rgba(255,255,255,0.05); color:#fff; border: 1px solid #333; border-radius: 10px; padding: 7px 14px;">
                      <option value="" style="background:#111;">All Cities</option>
                      <option value="Mumbai" style="background:#111;">Mumbai</option>
                      <option value="Delhi" style="background:#111;">Delhi</option>
                      <option value="Bangalore" style="background:#111;">Bangalore</option>
                      <option value="Hyderabad" style="background:#111;">Hyderabad</option>
                      <option value="Chennai" style="background:#111;">Chennai</option>
                      <option value="Kolkata" style="background:#111;">Kolkata</option>
                  </select>
              </div>
              <div class="col-md-3 col-sm-6">
                  <label class="form-label text-secondary small fw-bold">Max Price</label>
                  <select class="form-select" id="priceFilter" style="background: rgba(255,255,255,0.05); color:#fff; border: 1px solid #333; border-radius: 10px; padding: 7px 14px;">
                      <option value="" style="background:#111;">All Prices</option>
                      <option value="300" style="background:#111;">Max ₹300</option>
                      <option value="400" style="background:#111;">Max ₹400</option>
                      <option value="500" style="background:#111;">Max ₹500</option>
                  </select>
              </div>
              <div class="col-md-3 col-sm-6">
                  <label class="form-label text-secondary small fw-bold">Sort By</label>
                  <select class="form-select" id="sortFilter" style="background: rgba(255,255,255,0.05); color:#fff; border: 1px solid #333; border-radius: 10px; padding: 7px 14px;">
                      <option value="" style="background:#111;">Default</option>
                      <option value="rating-desc" style="background:#111;">Rating: High to Low</option>
                      <option value="date-desc" style="background:#111;">Newest</option>
                      <option value="popularity-desc" style="background:#111;">Popularity</option>
                      <option value="price-asc" style="background:#111;">Price: Low to High</option>
                  </select>
              </div>
              <div class="col-12 d-flex justify-content-end mt-2">
                  <button class="btn btn-outline-danger px-4 fw-bold" onclick="resetAllFilters()" style="border-radius: 10px; border-color: rgba(229, 9, 20, 0.4);"><i class="bi bi-arrow-counterclockwise"></i> Reset Filters</button>
              </div>
          </div>
      </div>
  </div>

  <!-- Movies List -->
  <div class="container shared-section">
    <h2 class="section-title mb-4"><span>Now</span> Showing</h2>
    <div id="movieList" class="grid mb-5"></div>
    
    <h2 class="section-title mb-4 mt-5"><span>Upcoming</span> Movies</h2>
    <div id="upcomingMovieList" class="grid"></div>
  </div>

  <footer class="text-center mt-5">
      <div class="container">
          <p class="mb-0">© 2026 Event Booking. All rights reserved.</p>
      </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
  <script src="movies.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
