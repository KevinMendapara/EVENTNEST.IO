<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="referrer" content="no-referrer-when-downgrade">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Theatre & Showtime | EventNest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Oswald:wght@700&display=swap');
        
        body {
            background-color: #0c0d14;
            color: #ffffff;
            font-family: 'DM Sans', sans-serif;
            margin: 0;
            padding-top: 80px;
            overflow-x: hidden;
        }

        /* Navbar styling */
        .navbar {
            background: rgba(12, 13, 20, 0.9) !important;
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px 30px;
        }

        /* Hero Mini Backdrop */
        .movie-backdrop-header {
            position: relative;
            height: 250px;
            background-size: cover;
            background-position: center 20%;
            display: flex;
            align-items: flex-end;
            margin-bottom: 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .backdrop-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(12, 13, 20, 0.2) 0%, #0c0d14 100%);
            z-index: 1;
        }

        .backdrop-content {
            position: relative;
            z-index: 2;
            padding: 0 4% 20px 4%;
            width: 100%;
        }

        .movie-title {
            font-family: 'Oswald', sans-serif;
            font-size: 2.8rem;
            text-transform: uppercase;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
            margin: 0;
        }

        /* Theatre Card Styling */
        .theatre-card {
            background: #12131c;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .theatre-card:hover {
            transform: translateY(-4px);
            border-color: rgba(229, 9, 20, 0.3);
            box-shadow: 0 15px 35px rgba(229, 9, 20, 0.1);
        }

        .facility-badge {
            background: rgba(255, 255, 255, 0.05);
            color: #ccc;
            font-size: 0.72rem;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 4px 10px;
        }

        .screen-group {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 15px;
        }

        .screen-name {
            font-size: 0.85rem;
            font-weight: 700;
            color: #e50914;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .showtime-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 8px 16px;
            transition: all 0.2s ease;
        }

        .showtime-btn:hover {
            background: #e50914;
            border-color: #e50914;
            color: #ffffff;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.35);
        }

        /* Movie Details Sidebar Card */
        .sidebar-card {
            background: #12131c;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            position: sticky;
            top: 100px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Scrollbar adjustments */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0c0d14;
        }
        ::-webkit-scrollbar-thumb {
            background: #222330;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #e50914;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="index.html">Event<span style="color:#e50914">Nest</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="movies.html" class="nav-link active" style="color:#e50914;">Movies</a></li>
                    <li class="nav-item"><a href="concerts.html" class="nav-link">Concerts</a></li>
                    <li class="nav-item"><a href="cricket.html" class="nav-link">Cricket</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Mini Backdrop -->
    <div class="movie-backdrop-header" id="backdropHeader" style="background-image: url('images/main_hero.png');">
        <div class="backdrop-vignette"></div>
        <div class="backdrop-content">
            <h1 class="movie-title" id="movieTitle">Movie Title</h1>
            <p class="text-secondary mb-0" id="movieHeaderMeta">Genre • Duration • Rating</p>
        </div>
    </div>

    <!-- Main Content Layout -->
    <div class="container mb-5">
        <div class="row g-4">
            
            <!-- Left Column: Theatres list -->
            <div class="col-lg-8">
                <h4 class="mb-4 d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-geo-alt-fill text-danger me-2"></i> Cinema Hall Showtimes</span>
                    <span class="badge bg-danger rounded-pill py-2 px-3 small" id="cityBadge" style="font-size:0.8rem;">City</span>
                </h4>
                
                <div id="theatreList" class="d-flex flex-column gap-4">
                    <!-- Loaded dynamically via JavaScript -->
                    <div class="text-center py-5 text-secondary">
                        <span class="spinner-border text-danger mb-3" role="status"></span>
                        <p>Locating best screens in your area...</p>
                    </div>
                </div>
            </div>

            <!-- Right Column: Sticky Movie Details Info -->
            <div class="col-lg-4">
                <div class="sidebar-card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold text-white mb-0"><i class="bi bi-info-circle text-danger me-2"></i> Movie Info</h5>
                        <span class="badge bg-secondary" id="certBadge">UA</span>
                    </div>
                    
                    <div class="text-center mb-4">
                        <img src="images/main_hero.png" id="sidebarPoster" class="img-fluid rounded-3 shadow" style="max-height: 280px; object-fit: cover; width: 100%; border: 1px solid rgba(255,255,255,0.05);" alt="Poster">
                    </div>

                    <div class="mb-3">
                        <span class="text-secondary small d-block">SYNOPSIS</span>
                        <p class="text-light small lh-base mb-0" id="sidebarSynopsis">No overview available for this movie.</p>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <span class="text-secondary small d-block">LANGUAGE</span>
                            <span class="text-white fw-bold small" id="sidebarLang">English</span>
                        </div>
                        <div class="col-6">
                            <span class="text-secondary small d-block">FORMATS</span>
                            <span class="text-white fw-bold small" id="sidebarFormats">2D, 3D, IMAX</span>
                        </div>
                    </div>

                    <hr style="border-color: rgba(255,255,255,0.1)">
                    
                    <button class="btn btn-outline-danger w-100 fw-bold py-2" onclick="history.back()">
                        <i class="bi bi-arrow-left me-2"></i> Back to Movie Details
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script -->
    <script src="theatre_selection.js"></script>

</body>
</html>
