<!DOCTYPE html>
<html>
<head>
    <meta name="referrer" content="no-referrer-when-downgrade">
  <title>Concerts</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="concert.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background: rgba(0,0,0,0.8) !important; backdrop-filter: blur(10px);">
      <div class="container-fluid px-4">
          <a class="navbar-brand fw-bold" href="index.html">Event<span style="color:#fff">Nest</span></a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
              <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menu">
              <div class="d-flex align-items-center ms-auto gap-3">
                  <!-- SEARCH BAR -->
                  <div class="d-flex">
                      <input class="form-control" type="search" placeholder="Search Singer..." id="search">
                  </div>
                  <!-- CITY SELECT -->
                  <select class="form-select" style="width:150px;" id="cityFilter">
                      <option value="">All Cities</option>
                      <option>Mumbai</option>
                      <option>Delhi</option>
                      <option>Bangalore</option>
                  </select>
                  <!-- MONTH SELECT -->
                  <select class="form-select" style="width:150px;" id="monthFilter">
                      <option value="">All Months</option>
                      <option>March</option>
                      <option>April</option>
                      <option>May</option>
                      <option>June</option>
                  </select>
                  <ul class="navbar-nav ms-auto">
                      <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                      <li class="nav-item"><a href="concerts.html" class="nav-link active">Events</a></li>
                  </ul>
              </div>
          </div>
      </div>
  </nav>

  <!-- Hero Section -->
  <header class="concert-hero"></header>

  <style>
      .concert-hero {
          position: relative;
          height: 45vh;
          min-height: 300px;
          background: url('images/c_hero.jpg') center/cover no-repeat;
          margin-top: 76px; /* offset fixed navbar */
          margin-bottom: 40px;
          border-bottom: 2px solid var(--netflix-red, #e50914);
          box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
      @media (max-width: 768px) {
          .concert-hero {
              height: 30vh;
              min-height: 200px;
              margin-top: 56px;
          }
      }
  </style>

  <div class="container mb-5">
    <h2 class="fw-bold text-white mb-4 border-bottom border-danger pb-2 d-inline-block">Trending Artists</h2>
    <div id="concertList" class="grid mt-2"></div>
  </div>

  <script src="concerts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
